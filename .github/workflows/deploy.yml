# 公開サーバ (Fly.io) へのデプロイ。Actions の画面から手動で起動する。main からだけ動く。
# FLY_API_TOKEN は environment「production」の secret (このアプリだけをデプロイできる deploy トークン)。
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - name: テスト・型チェックの後にデプロイ
        run: make deploy FLYCTL=flyctl
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: ヘルスチェック
        run: curl --fail --retry 5 --retry-delay 5 https://sts2stats.fly.dev/healthz
