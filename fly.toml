# fly.toml app configuration file generated for sts2stats on 2026-11-22T03:21:33+09:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'sts2stats'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  BASE_URL = 'https://sts2stats.fly.dev'
  DATABASE_PATH = '/data/data.db'
  LOG_LEVEL = 'info'
  PORT = '8080'

[[mounts]]
  source = 'sts2stats_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'get'
    path = '/healthz'
    protocol = 'http'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
